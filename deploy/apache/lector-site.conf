# Apache 2.4 — site Lector
# Destino: /etc/apache2/sites-available/lector-site.conf (Ubuntu/Debian)
#
# O Apache serve os arquivos estáticos direto do disco e encaminha SOMENTE
# /api/* para o Node (server.js na porta 3000), que executa as funções de api/.
# Os formulários dependem desse proxy — sem o Node no ar, /api/* devolve 503.
#
# Módulos necessários:
#   sudo a2enmod rewrite proxy proxy_http headers expires deflate
#
# As regras de RewriteRule abaixo espelham "rewrites" do vercel.json.
# Ao adicionar uma página nova lá, replique aqui.

<VirtualHost *:80>
    ServerName SEU_DOMINIO.com.br
    ServerAlias www.SEU_DOMINIO.com.br

    DocumentRoot /var/www/lector-site

    ErrorLog  ${APACHE_LOG_DIR}/lector-site-error.log
    CustomLog ${APACHE_LOG_DIR}/lector-site-access.log combined

    AddDefaultCharset UTF-8
    DirectoryIndex index.dc.html index.html

    <Directory /var/www/lector-site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Nunca servir credenciais, git ou o servidor Node como arquivo
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(server|devserver)\.js$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(\.git|node_modules|deploy)/">
        Require all denied
    </DirectoryMatch>

    # ── /api/* → Node ────────────────────────────────────────────────────
    # Precisa vir antes das regras de rewrite.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyTimeout 60

    # ── URLs limpas (espelho do vercel.json) ─────────────────────────────
    RewriteEngine On

    # /api/ já foi tratado pelo proxy
    RewriteRule ^/api/ - [L]

    RewriteRule ^/?$                        /pages/home/index.dc.html                   [L]
    RewriteRule ^/home/?$                   /pages/home/index.dc.html                   [L]
    RewriteRule ^/blog/?$                   /pages/blog/index.dc.html                   [L]
    RewriteRule ^/contato/?$                /pages/contato/index.dc.html                [L]
    RewriteRule ^/plataforma-lector/?$      /pages/plataforma-lector/index.dc.html      [L]
    RewriteRule ^/copiloto-vendas/?$        /pages/copiloto-vendas/index.dc.html        [L]
    RewriteRule ^/solucao-nr-1/?$           /pages/solucao-nr-1/index.dc.html           [L]
    RewriteRule ^/conteudo-sob-demanda/?$   /pages/conteudo-sob-demanda/index.dc.html   [L]
    RewriteRule ^/diagnostico-gaps/?$       /pages/diagnostico-gaps/index.dc.html       [L]
    RewriteRule ^/servicos-especializados/?$ /pages/servicos-especializados/index.dc.html [L]
    RewriteRule ^/clientes/?$               /pages/clientes/index.dc.html               [L]
    RewriteRule ^/sobre/?$                  /pages/sobre/index.dc.html                  [L]

    # ── Tipos de conteúdo ────────────────────────────────────────────────
    AddType application/xml .xml
    <Files "llms.txt">
        ForceType text/plain
        Header set Cache-Control "public, max-age=3600"
    </Files>

    # ── Cache (mesma política do server.js) ──────────────────────────────
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"

        # HTML sempre revalidado — o conteúdo muda a cada deploy
        <FilesMatch "\.html$">
            Header set Cache-Control "no-cache"
        </FilesMatch>

        # Imagens, fontes e vídeos
        <FilesMatch "\.(png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|mp4|webm|mp3)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>

        # CSS/JS
        <FilesMatch "\.(css|js|mjs)$">
            Header set Cache-Control "public, max-age=3600"
        </FilesMatch>
    </IfModule>

    # Mídia versionada: cache longo, sobrescreve a regra acima
    <Location /assets/media/>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Location>

    # ── Compressão ───────────────────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
                                      application/javascript application/json \
                                      application/xml image/svg+xml
    </IfModule>
</VirtualHost>
