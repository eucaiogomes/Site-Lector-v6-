# /etc/nginx/sites-available/lector-site
# Proxy reverso para o Node (porta 3000). O Node continua responsável pelos
# rewrites de vercel.json e pelas rotas /api/*, então a configuração fica em um
# lugar só. Depois rode `sudo certbot --nginx -d seu-dominio.com.br` para o HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

    client_max_body_size 1m;

    # IP real do visitante chega ao Node (usado pelo rate limit de /api/*)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Vídeos e imagens grandes: sem buffer intermediário
    location /assets/media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
}
